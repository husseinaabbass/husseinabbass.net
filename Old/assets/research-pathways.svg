<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Converging research pathways into Trusted Autonomy</title>
  <desc id="desc">A light but prominent research pathway diagram where constraint logic programming, neural networks and evolutionary computation, swarm intelligence, and human-swarm teaming converge naturally into trusted autonomy.</desc>
  <rect width="1600" height="900" fill="#fbfcfa"/>
  <defs>
    <radialGradient id="trustGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#F0E442" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#56B4E9" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0072B2" opacity=".48"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#009E73" opacity=".48"/>
    </marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E69F00" opacity=".48"/>
    </marker>
    <marker id="arrowPurple" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#CC79A7" opacity=".48"/>
    </marker>
  </defs>

  <ellipse cx="1160" cy="440" rx="360" ry="270" fill="url(#trustGlow)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 645 C310 590 445 610 585 526 C732 438 842 430 1012 434" stroke="#0072B2" stroke-width="13" opacity=".48" marker-end="url(#arrowBlue)"/>
    <path d="M155 442 C324 390 490 346 642 376 C795 406 875 482 1014 452" stroke="#009E73" stroke-width="12" opacity=".48" marker-end="url(#arrowGreen)"/>
    <path d="M160 250 C354 278 476 458 642 488 C780 512 884 476 1018 454" stroke="#E69F00" stroke-width="12" opacity=".48" marker-end="url(#arrowOrange)"/>
    <path d="M286 770 C444 682 568 676 706 602 C834 534 902 478 1022 458" stroke="#CC79A7" stroke-width="11" opacity=".48" marker-end="url(#arrowPurple)"/>
  </g>

  <g opacity=".76">
    <circle cx="140" cy="645" r="22" fill="#0072B2"/>
    <circle cx="155" cy="442" r="22" fill="#009E73"/>
    <circle cx="160" cy="250" r="22" fill="#E69F00"/>
    <circle cx="286" cy="770" r="22" fill="#CC79A7"/>
    <circle cx="1028" cy="452" r="28" fill="#D55E00"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#18212b">
    <g font-weight="900" opacity=".34">
      <text x="82" y="606" font-size="35">constraint logic programming</text>
      <text x="96" y="402" font-size="34">neural networks</text>
      <text x="210" y="474" font-size="31">evolutionary computation</text>
      <text x="92" y="214" font-size="36">swarm intelligence</text>
      <text x="214" y="816" font-size="35">human-swarm teaming</text>
    </g>

    <g font-weight="950" opacity=".2">
      <text x="1000" y="370" font-size="74">Trusted Autonomy</text>
    </g>
    <g font-weight="850" opacity=".24">
      <text x="1046" y="426" font-size="30">ethics</text>
      <text x="1182" y="430" font-size="30">governance</text>
      <text x="1336" y="430" font-size="28">safety</text>
      <text x="1030" y="486" font-size="29">responsibility</text>
      <text x="1236" y="486" font-size="29">accountability</text>
      <text x="1058" y="544" font-size="28">explainability</text>
      <text x="1262" y="544" font-size="28">social integration</text>
      <text x="1094" y="602" font-size="28">test</text>
      <text x="1198" y="602" font-size="28">evaluation</text>
      <text x="1350" y="602" font-size="27">verification</text>
      <text x="1158" y="660" font-size="28">validation</text>
    </g>
  </g>

  <g fill="none" stroke="#18212b" stroke-width="1.5" opacity=".14">
    <circle cx="1160" cy="506" r="156"/>
    <circle cx="1160" cy="506" r="220"/>
  </g>
</svg>
